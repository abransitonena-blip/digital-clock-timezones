<div id="floaties" class="floaties" aria-hidden="true"></div>

<main class="page cover-wrap">
  <p class="eyebrow reveal">para ti</p>
  <h1 class="title-script reveal">Sam</h1>
  <p class="subtitle reveal">Hoy se regalan flores amarillas <svg class="icon" aria-hidden="true"><use href="#icon-flower"></use></svg> y quise que tuvieras también una playlist, y una carta.</p>

  <section class="card playlist-card reveal">
    <p class="card-label">Nuestra playlist</p>
    <div class="iframe-wrap">
      <iframe

        height="450"

    <a class="btn btn-outline" href="https://music.apple.com/mx/playlist/te-amo/pl.u-NpXmzemCLL5A5e5" target="_blank" rel="noopener">Abrir en Apple Music ↗</a>
  </section>

  <a class="btn btn-primary pulse reveal" href="./carta.html">Sigue aquí <svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg></a>
