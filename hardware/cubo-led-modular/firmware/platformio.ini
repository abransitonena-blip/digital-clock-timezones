; Cubo AP · ESP32-C3. Compilar: pio run   Subir por USB: pio run -t upload   Monitor: pio device monitor
[env:cubo_ap]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; la app (~1.4 MB con BLE + Wi-Fi) no cabe en la partición por defecto de 1.25 MB: dos ranuras OTA de 1.9 MB
board_build.partitions = min_spiffs.csv
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = pre:gen_pagina_pio.py
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2
  aircoookie/Espalexa@2.7.0
  adafruit/Adafruit NeoPixel@1.12.3
test_ignore = *
