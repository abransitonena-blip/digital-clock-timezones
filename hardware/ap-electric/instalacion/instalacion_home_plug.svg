<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" style="font-family:DejaVu Sans,sans-serif;font-size:22px;font-weight:bold">Home Plug: enchufar y usar (sin tocar conductores)</text><rect x="60" y="120" width="180" height="160" rx="8" fill="#f4f4f6" stroke="#1D1F24" stroke-width="2"/><text x="150" y="142" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:bold" fill="#1D1F24">Contacto de pared</text><text x="150" y="160" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">127 V~ con tierra</text><text x="150" y="175" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">(NEMA 5-15R)</text><rect x="360" y="110" width="200" height="180" rx="8" fill="#fff4ea" stroke="#E07000" stroke-width="2"/><text x="460" y="132" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:bold" fill="#E07000">AP Home Plug</text><text x="460" y="150" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">clavija atrás</text><text x="460" y="165" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">receptáculo al frente</text><text x="460" y="180" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">botón y LED</text><rect x="680" y="120" width="160" height="160" rx="8" fill="#f4f4f6" stroke="#1D1F24" stroke-width="2"/><text x="760" y="142" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:bold" fill="#1D1F24">Lámpara</text><text x="760" y="160" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">con su clavija</text><text x="760" y="175" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">y su apagador</text><text x="760" y="190" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">(debe quedar en ON)</text><path d="M240 200 L360 200" fill="none" stroke="#000" stroke-width="6"  stroke-linejoin="round"/><text x="262" y="192" style="font-family:DejaVu Sans,sans-serif;font-size:12px;" fill="#000">se enchufa</text><path d="M560 200 L680 200" fill="none" stroke="#000" stroke-width="6"  stroke-linejoin="round"/><text x="585" y="192" style="font-family:DejaVu Sans,sans-serif;font-size:12px;" fill="#000">se enchufa</text><text x="60" y="330" style="font-family:DejaVu Sans,sans-serif;font-size:14px;font-weight:bold" fill="#C0281F">Si el apagador propio de la lámpara está abierto, el Home Plug no puede encenderla.</text><text x="60" y="356" style="font-family:DejaVu Sans,sans-serif;font-size:13px;" fill="#000">Solo lámparas de encendido/apagado no regulables. Carga máxima: ver etiqueta (por determinar).</text><text x="60" y="380" style="font-family:DejaVu Sans,sans-serif;font-size:13px;" fill="#000">Funciona sin internet: el botón enciende y apaga; la app y la red son opcionales.</text></svg>