<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" style="font-family:DejaVu Sans,sans-serif;font-size:22px;font-weight:bold">Home Switch con apagadores de escalera (3 vías)</text><rect x="40" y="70" width="170" height="120" rx="8" fill="#f4f4f6" stroke="#1D1F24" stroke-width="2"/><text x="125" y="92" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:bold" fill="#1D1F24">Tablero</text><text x="125" y="110" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">interruptor</text><text x="125" y="125" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">termomagnético</text><rect x="560" y="280" width="240" height="150" rx="8" fill="#fff4ea" stroke="#E07000" stroke-width="2"/><text x="680" y="302" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:bold" fill="#E07000">AP Home Switch</text><text x="680" y="320" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px" fill="#555">L   N   SW   LS</text><circle cx="590" cy="280" r="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="590" y="268" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px;font-weight:bold">L</text><circle cx="640" cy="280" r="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="640" y="268" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px;font-weight:bold">N</text><circle cx="730" cy="280" r="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="730" y="268" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px;font-weight:bold">SW</text><circle cx="780" cy="280" r="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="780" y="268" text-anchor="middle" style="font-family:DejaVu Sans,sans-serif;font-size:12px;font-weight:bold">LS</text><path d="M210 110 L470 110 L470 240 L590 240 L590 274" fill="none" stroke="#C0281F" stroke-width="3"  stroke-linejoin="round"/><path d="M210 150 L250 150 L250 520 L940 520 L940 370" fill="none" stroke="#1f5fbf" stroke-width="3"  stroke-linejoin="round"/><path d="M640 274 L640 260 L250 260" fill="none" stroke="#1f5fbf" stroke-width="3"  stroke-linejoin="round"/><path d="M470 110 L300 110 L300 330" fill="none" stroke="#C0281F" stroke-width="3"  stroke-linejoin="round"/><circle cx="300" cy="330" r="5"/><circle cx="340" cy="310" r="5"/><circle cx="340" cy="350" r="5"/><path d="M300 330 L338 312" stroke="#000" stroke-width="3"/><circle cx="470" cy="330" r="5"/><circle cx="430" cy="310" r="5"/><circle cx="430" cy="350" r="5"/><path d="M470 330 L432 312" stroke="#000" stroke-width="3"/><text x="270" y="380" style="font-family:DejaVu Sans,sans-serif;font-size:12px;" fill="#000">Apagador 1 (3 vías)</text><text x="410" y="380" style="font-family:DejaVu Sans,sans-serif;font-size:12px;" fill="#000">Apagador 2 (3 vías)</text><path d="M340 310 L430 310 M340 350 L430 350" stroke="#C0281F" stroke-width="3"/><text x="352" y="302" style="font-family:DejaVu Sans,sans-serif;font-size:11px;" fill="#C0281F">viajeros</text><path d="M470 330 L520 330 L520 220 L730 220 L730 274" fill="none" stroke="#C0281F" stroke-width="3"  stroke-linejoin="round"/><text x="540" y="212" style="font-family:DejaVu Sans,sans-serif;font-size:12px;" fill="#C0281F">salida común del apagador 2 → SW</text><path d="M780 274 L780 200 L940 200 L940 310" fill="none" stroke="#C0281F" stroke-width="3"  stroke-linejoin="round"/><circle cx="940" cy="340" r="20" fill="#fff8d6" stroke="#000" stroke-width="2"/><path d="M926 326 l28 28 M954 326 l-28 28" stroke="#000" stroke-width="2"/><text x="910" y="380" style="font-family:DejaVu Sans,sans-serif;font-size:12px;" fill="#000">Lámpara</text><path d="M40 430 L80 430" fill="none" stroke="#C0281F" stroke-width="3"  stroke-linejoin="round"/><text x="90" y="435" style="font-family: